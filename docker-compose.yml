version: '3.8'
services:
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    # ponytail: no host port. Redis is only reachable from within the
    # compose network (api + worker). For host-side debugging, use
    # `docker compose exec redis redis-cli -a $REDIS_PASSWORD` or set
    # REDIS_PASSWORD via env. Exposing 6379 on the host is a leak
    # surface on multi-tenant hosts.
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 5s
      retries: 3

  api:
    build:
      context: ./handclip-backend
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - PORT=3000
      - APP_URL=${APP_URL}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - CORS_ORIGIN=${CORS_ORIGIN}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--spider', 'http://localhost:3000/api/health']
      interval: 15s
      retries: 3
      start_period: 10s
  worker:
    build:
      context: ./handclip-backend
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    ports:
      - '3001:3001'
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - WORKER_PORT=3001
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
    healthcheck:
      test: ['CMD', 'wget', '--spider', 'http://localhost:3001/health']
      interval: 15s
      retries: 3
      start_period: 60s
    depends_on:
      redis:
        condition: service_healthy
volumes:
  redis_data: