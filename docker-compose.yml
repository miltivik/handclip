services:
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - '6379:6379'
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 5s
      retries: 3

  api:
    build:
      context: ./handclip-backend
      dockerfile: apps/api/Dockerfile
    ports:
      - '3000:3000'
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - PORT=3000
      - AI_CONNECTIONS_ENCRYPTION_KEY=${AI_CONNECTIONS_ENCRYPTION_KEY}
      - HANDCLIP_LLM_ALLOW_API_KEY_FALLBACK=${HANDCLIP_LLM_ALLOW_API_KEY_FALLBACK:-false}
      - POLAR_ACCESS_TOKEN=${POLAR_ACCESS_TOKEN}
      - POLAR_PRODUCT_ID=${POLAR_PRODUCT_ID}
      - POLAR_WEBHOOK_SECRET=${POLAR_WEBHOOK_SECRET}
      - POLAR_API_URL=${POLAR_API_URL:-https://sandbox-api.polar.sh/v1}
      - POLAR_SUCCESS_URL=${POLAR_SUCCESS_URL:-handclip://settings}
      - POLAR_RETURN_URL=${POLAR_RETURN_URL:-handclip://settings}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - CORS_ORIGIN=${CORS_ORIGIN}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--spider', 'http://localhost:3000/api/health']
      interval: 15s
      retries: 3
      start_period: 10s
  worker:
    build:
      context: ./handclip-backend
      dockerfile: apps/worker/Dockerfile
    ports:
      - '3001:3001'
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - HANDCLIP_LLM_PROVIDER=${HANDCLIP_LLM_PROVIDER:-api-key}
      - HANDCLIP_LLM_ALLOW_API_KEY_FALLBACK=${HANDCLIP_LLM_ALLOW_API_KEY_FALLBACK:-false}
      - HANDCLIP_OAUTH_CREDENTIALS_PATH=/app/.handclip/auth.json
      - HANDCLIP_CODEX_MODEL=${HANDCLIP_CODEX_MODEL:-gpt-5.3-codex}
      - HANDCLIP_ANTHROPIC_MODEL=${HANDCLIP_ANTHROPIC_MODEL:-claude-sonnet-4-6}
      - AI_CONNECTIONS_ENCRYPTION_KEY=${AI_CONNECTIONS_ENCRYPTION_KEY}
      - WORKER_PORT=3001
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
    healthcheck:
      test: ['CMD', 'wget', '--spider', 'http://localhost:3001/health']
      interval: 15s
      retries: 3
      start_period: 10s
    volumes:
      - ./handclip-backend/apps/worker/.local:/app/.handclip
    depends_on:
      redis:
        condition: service_healthy
volumes:
  redis_data:
